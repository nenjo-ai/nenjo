name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    name: Format
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets

  build:
    name: Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      # A separate invocation catches features masked by workspace/dev dependencies.
      - name: Check standalone model documentation
        run: cargo doc --locked --no-deps -p nenjo-models

  audit:
    name: Audit Dependencies
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
        env:
          RUSTFLAGS: ""
      - name: Audit
        run: cargo audit

  test:
    name: Test
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      # Version must match PDFIUM_VERSION in Dockerfile and pdfium-render in Cargo.toml.
      PDFIUM_VERSION: 7881
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install Pdfium
        run: |
          curl -fsSL -o /tmp/pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F${PDFIUM_VERSION}/pdfium-linux-x64.tgz"
          mkdir -p /opt/pdfium/lib
          tar -xzf /tmp/pdfium.tgz -C /opt/pdfium
          echo "NENJO_PDFIUM_LIBRARY=/opt/pdfium/lib/libpdfium.so" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --workspace

  docker:
    name: Docker Images
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: useblacksmith/setup-docker-builder@v1

      - name: Build runtime image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          target: runtime
          load: true
          tags: nenjo-worker:ci-runtime

      - name: Smoke test runtime image
        run: |
          docker run --rm --network none --entrypoint sh \
            -v "$PWD/.github/scripts/docker-tool-permissions.sh:/tmp/docker-tool-permissions.sh:ro" \
            nenjo-worker:ci-runtime /tmp/docker-tool-permissions.sh runtime
          docker run --rm nenjo-worker:ci-runtime --version
          docker run --rm --entrypoint nenpm nenjo-worker:ci-runtime --version
          docker run --rm --entrypoint nenjoup nenjo-worker:ci-runtime --version
          docker run --rm --entrypoint sh nenjo-worker:ci-runtime -c '
            python3 --version &&
            python3 -m venv /tmp/venv &&
            curl --version &&
            wget --version &&
            jq --version &&
            git --version &&
            git lfs version &&
            rg --version &&
            tar --version &&
            test -r "$NENJO_PDFIUM_LIBRARY"
          '

      - name: Build dev image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          target: dev
          load: true
          tags: nenjo-worker:ci-dev

      - name: Smoke test dev image
        run: |
          docker run --rm --network none --entrypoint sh \
            -v "$PWD/.github/scripts/docker-tool-permissions.sh:/tmp/docker-tool-permissions.sh:ro" \
            nenjo-worker:ci-dev /tmp/docker-tool-permissions.sh dev
          docker run --rm --entrypoint sh nenjo-worker:ci-dev -c '
            rustc --version &&
            cargo --version &&
            node --version | rg "^v24\." &&
            npm --version &&
            gh --version &&
            docker --version &&
            python3 -m venv /tmp/venv
          '

      - name: Build heavy image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          target: heavy
          load: true
          tags: nenjo-worker:ci-heavy

      - name: Smoke test heavy image
        run: |
          docker run --rm --network none --entrypoint sh \
            -v "$PWD/.github/scripts/docker-tool-permissions.sh:/tmp/docker-tool-permissions.sh:ro" \
            nenjo-worker:ci-heavy /tmp/docker-tool-permissions.sh heavy
          docker run --rm --network none --entrypoint sh \
            -v "$PWD/.github/scripts/docker-tool-permissions.sh:/tmp/docker-tool-permissions.sh:ro" \
            nenjo-worker:ci-heavy -c 'env -i HOME="$HOME" PATH="$PATH" sh /tmp/docker-tool-permissions.sh heavy'
          docker run --rm --entrypoint sh nenjo-worker:ci-heavy -c '
            agent-browser --version &&
            chromium --version &&
            test "$(readlink /home/nenjo/.agent-browser)" = "/home/nenjo/.nenjo/browser-state" &&
            test "$(stat -c %a /home/nenjo/.nenjo/browser-state)" = "700" &&
            agent-browser --namespace nenjo-ci --session default --restore default open --json &&
            agent-browser --namespace nenjo-ci --session default --restore default snapshot -i --json &&
            agent-browser --namespace nenjo-ci --session default --restore default close --json
          '
